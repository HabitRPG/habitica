name: Test

on:
  push:
    branches-ignore:
    - 'phillip/**'
    - 'sabrecat/**'
    - 'kalista/**'
    - 'natalie/**'
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test
    - run: npm run lint-no-fix

  sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test
    - run: npm run test:sanity

  common:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test
    - run: npm run test:common

  content:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test
    - run: npm run test:content

  api-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        mongodb-version: [7.0]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Start MongoDB ${{ matrix.mongodb-version }}
      # Runs in the background so pulling the image overlaps with npm ci,
      # the replica set is initiated right before the tests
      run: nohup docker run --name mongodb --publish 27017:27017 --detach mongo:${{ matrix.mongodb-version }} --replSet rs > /tmp/mongodb-start.log 2>&1 &
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test

    - name: Initiate MongoDB replica set
      timeout-minutes: 3
      run: |
        for i in $(seq 1 120); do
          docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 })' > /dev/null 2>&1 && break
          if [ "$i" = 120 ]; then cat /tmp/mongodb-start.log; exit 1; fi
          sleep 1
        done
        docker exec mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs", members: [{ _id: 0, host: "localhost:27017" }] })'
        until docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done

    - run: npm run test:api:unit
      env:
        REQUIRES_SERVER=true: true

  api-v3-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        mongodb-version: [7.0]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Start MongoDB ${{ matrix.mongodb-version }}
      # Runs in the background so pulling the image overlaps with npm ci,
      # the replica set is initiated right before the tests
      run: nohup docker run --name mongodb --publish 27017:27017 --detach mongo:${{ matrix.mongodb-version }} --replSet rs > /tmp/mongodb-start.log 2>&1 &
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test

    - name: Initiate MongoDB replica set
      timeout-minutes: 3
      run: |
        for i in $(seq 1 120); do
          docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 })' > /dev/null 2>&1 && break
          if [ "$i" = 120 ]; then cat /tmp/mongodb-start.log; exit 1; fi
          sleep 1
        done
        docker exec mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs", members: [{ _id: 0, host: "localhost:27017" }] })'
        until docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done

    - run: npm run test:api-v3:integration
      env:
        REQUIRES_SERVER=true: true

  api-v4-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
        mongodb-version: [7.0]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Start MongoDB ${{ matrix.mongodb-version }}
      # Runs in the background so pulling the image overlaps with npm ci,
      # the replica set is initiated right before the tests
      run: nohup docker run --name mongodb --publish 27017:27017 --detach mongo:${{ matrix.mongodb-version }} --replSet rs > /tmp/mongodb-start.log 2>&1 &
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test

    - name: Initiate MongoDB replica set
      timeout-minutes: 3
      run: |
        for i in $(seq 1 120); do
          docker exec mongodb mongosh --quiet --eval 'db.runCommand({ ping: 1 })' > /dev/null 2>&1 && break
          if [ "$i" = 120 ]; then cat /tmp/mongodb-start.log; exit 1; fi
          sleep 1
        done
        docker exec mongodb mongosh --quiet --eval 'rs.initiate({ _id: "rs", members: [{ _id: 0, host: "localhost:27017" }] })'
        until docker exec mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done

    - run: npm run test:api-v4:integration
      env:
        REQUIRES_SERVER=true: true

  client-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: test
    - run: npm run test:unit
      working-directory: ./website/client

  production-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: cp config.json.example config.json
    - name: npm install
      run: |
        npm ci
      env:
        CI: true
        NODE_ENV: production
